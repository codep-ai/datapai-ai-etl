<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DATAP.AI — column-level lineage on dbt, animated</title>
<style>
  /* Self-contained animated explainer. 30 s loop. White background for web + LinkedIn.
     Freeze at a moment for frame capture: ?t=<seconds>  (e.g. lineage_explainer.html?t=9.5) */
  :root { --ink:#1f2328; --muted:#6b7280; --line:#cfd6dd; --panel:#f6f8fa; --accent:#0969da;
          --up:#d4700a; --pii:#cf222e; --ok:#1a7f37; --brand:#0b3d91; }
  html,body { margin:0; background:#fff; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); }
  .stage { width:1200px; height:675px; position:relative; overflow:hidden; background:#fff; }
  svg { position:absolute; inset:0; }
  text { font-family:inherit; }
  .h { font-size:30px; font-weight:700; fill:var(--ink); }
  .sub { font-size:17px; fill:var(--muted); }
  .box { fill:var(--panel); stroke:var(--line); stroke-width:1.5; rx:8; }
  .title { font-size:15px; font-weight:600; fill:var(--ink); }
  .layer { font-size:11px; fill:var(--muted); }
  .col { font-size:12.5px; fill:var(--ink); }
  .edge { fill:none; stroke:#b6c2cf; stroke-width:1.6; }
  .tedge { fill:none; stroke:#9aa7b4; stroke-width:2.2; }
  .hl { stroke:var(--up); stroke-width:3; }
  .pii { stroke:var(--pii); stroke-width:3; }
  .badge { font-size:12px; font-weight:600; }
  .chip { rx:10; }
  .cap { font-size:20px; fill:var(--ink); font-weight:600; }
  .cap2 { font-size:15px; fill:var(--muted); }
  .brand { font-size:14px; font-weight:700; fill:var(--brand); letter-spacing:.5px; }

  /* ── timeline (30 s): 5 scenes × 6 s ── */
  @keyframes s1 { 0%,1%{opacity:0} 4%,18%{opacity:1} 20%,100%{opacity:0} }
  @keyframes s2 { 0%,19%{opacity:0} 22%,38%{opacity:1} 40%,100%{opacity:0} }
  @keyframes s3 { 0%,39%{opacity:0} 42%,58%{opacity:1} 60%,100%{opacity:0} }
  @keyframes s4 { 0%,59%{opacity:0} 62%,78%{opacity:1} 80%,100%{opacity:0} }
  @keyframes s5 { 0%,79%{opacity:0} 82%,98%{opacity:1} 100%{opacity:0} }
  .scene { animation-duration:30s; animation-iteration-count:infinite; animation-timing-function:ease-in-out; }
  .sc1 { animation-name:s1 } .sc2 { animation-name:s2 } .sc3 { animation-name:s3 } .sc4 { animation-name:s4 } .sc5 { animation-name:s5 }

  /* draw-in for edges */
  .draw { stroke-dasharray:600; stroke-dashoffset:600; animation:draw 30s infinite; }
  @keyframes draw { 0%,23%{stroke-dashoffset:600} 32%,100%{stroke-dashoffset:0} }
  .draw3 { stroke-dasharray:600; stroke-dashoffset:600; animation:draw3 30s infinite; }
  @keyframes draw3 { 0%,43%{stroke-dashoffset:600} 51%,100%{stroke-dashoffset:0} }
  .draw4 { stroke-dasharray:900; stroke-dashoffset:900; animation:draw4 30s infinite; }
  @keyframes draw4 { 0%,63%{stroke-dashoffset:900} 72%,100%{stroke-dashoffset:0} }
  .cursor { animation:cur 30s infinite; }
  @keyframes cur { 0%,42%{transform:translate(0,0);opacity:0} 44%{opacity:1;transform:translate(0,0)} 48%,52%{transform:translate(-560px,-118px);opacity:1} 54%,100%{opacity:0} }
  .fadein { animation:fin 30s infinite; } @keyframes fin { 0%,48%{opacity:0} 52%,58%{opacity:1} 60%,100%{opacity:0} }
  .fadein4 { animation:fin4 30s infinite; } @keyframes fin4 { 0%,69%{opacity:0} 73%,78%{opacity:1} 80%,100%{opacity:0} }
  .cursor5 { animation:cur5 30s infinite; }
  @keyframes cur5 { 0%,82%{transform:translate(0,0);opacity:0} 84%{opacity:1;transform:translate(0,0)} 87%,89%{transform:translate(-330px,-140px);opacity:1} 90%,100%{opacity:0} }
  .docwin { animation:docwin 30s infinite; transform-origin:400px 160px; }
  @keyframes docwin { 0%,88%{opacity:0;transform:scale(.96)} 91%,98%{opacity:1;transform:scale(1)} 100%{opacity:0} }
  .paused * { animation-play-state:paused !important; }
</style>
</head>

  <text x="1160" y="640" text-anchor="end" class="sub" style="font-size:13px">dbt-core + sqlglot · deterministic · runs in your VPC</text>

  <!-- ══ Scene 1: dbt docs, table-level only ══ -->
  <g class="scene sc1">
    <text x="40" y="62" class="h">dbt docs shows tables. It stops there.</text>
    <text x="40" y="92" class="sub">dbt-core knows which model reads which model — never which column feeds which column.</text>

      <text x="20" y="30" class="cap" style="fill:#9a3412">The regulator asks: “where did this number come from?”</text>
      <text x="20" y="54" class="cap2">Table lineage cannot answer. dbt Cloud can — per seat, offshore. Catalog platforms can — if you adopt the platform.</text>

      <text x="20" y="30" class="cap" style="fill:#0b3d91">Every output column → the exact upstream columns it was computed from.</text>
      <text x="20" y="54" class="cap2">Stock demo: 11 models, 166 column edges. Whole dbt-demo project: 90 models, 903 edges. Works on any dbt project from manifest.json + catalog.json.</text>
