<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DATAP.AI — where did this number come from?</title>
<style>
  /* SHORT v3: 12 s loop, 3 scenes × 4 s. Scene 2 = click the table → its dbt docs page (Code tab) proving Iceberg. Scene 3 = PII. White background. Customer language only (no internal tool names).
     Companion: lineage_explainer_long.html (30 s, 5 scenes, includes the "dbt docs stops at tables" set-up).
     Freeze a moment for frame capture: ?t=<seconds> */
  :root { --ink:#1f2328; --muted:#6b7280; --line:#cfd6dd; --panel:#f6f8fa; --accent:#0969da;
          --up:#d4700a; --pii:#cf222e; --ok:#1a7f37; --brand:#0b3d91; }
  html,body { margin:0; background:#fff; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); }
  .stage { width:1200px; height:675px; position:relative; overflow:hidden; background:#fff; }
  svg { position:absolute; inset:0; } text { font-family:inherit; }
  .h { font-size:38px; font-weight:800; fill:var(--ink); letter-spacing:-.3px; }
  .sub { font-size:19px; fill:var(--muted); }
  .box { fill:var(--panel); stroke:var(--line); stroke-width:1.5; rx:8; }
  .title { font-size:15px; font-weight:600; fill:var(--ink); }
  .col { font-size:13px; fill:var(--ink); }
  .edge { fill:none; stroke:#b6c2cf; stroke-width:1.6; }
  .hl { stroke:var(--up); stroke-width:3.2; } .pii { stroke:var(--pii); stroke-width:3.2; }
  .cap { font-size:21px; fill:var(--ink); font-weight:700; } .cap2 { font-size:15px; fill:var(--muted); }
  .badge { font-size:12.5px; font-weight:600; }
  .brand { font-size:14px; font-weight:700; fill:var(--brand); letter-spacing:.5px; }

  /* scenes: A 0–4  B 4–8  C 8–12 (percent of 12 s) */
  .scene { animation-duration:12s; animation-iteration-count:infinite; animation-timing-function:ease-in-out; }
  @keyframes sA { 0%{opacity:0} 3%,31%{opacity:1} 34%,100%{opacity:0} }
  @keyframes sB { 0%,32%{opacity:0} 36%,64%{opacity:1} 67%,100%{opacity:0} }
  @keyframes sC { 0%,66%{opacity:0} 70%,97%{opacity:1} 100%{opacity:0} }
  .scA{animation-name:sA} .scB{animation-name:sB} .scC{animation-name:sC}
  /* scene A: cursor moves 0.4–1.0 s, click at 1.0 s, path draws 1.0–2.2 s, caption 2.4 s */
  .curA { animation:curA 12s infinite; }
  @keyframes curA { 0%{transform:translate(0,0);opacity:0} 3%{opacity:1;transform:translate(0,0)} 8%,9%{transform:translate(-95px,-140px);opacity:1} 10%{transform:translate(-95px,-140px) scale(.85)} 11%,30%{transform:translate(-95px,-140px);opacity:1} 32%,100%{opacity:0} }
  .drawA { stroke-dasharray:700; stroke-dashoffset:700; animation:drawA 12s infinite; }
  @keyframes drawA { 0%,9%{stroke-dashoffset:700} 19%,100%{stroke-dashoffset:0} }
  .selA { animation:selA 12s infinite; } @keyframes selA { 0%,9%{opacity:0} 10%,100%{opacity:1} }
  .capA { animation:capA 12s infinite; } @keyframes capA { 0%,19%{opacity:0} 22%,31%{opacity:1} 34%,100%{opacity:0} }
  /* scene B (4–8 s): cursor to the table title 4.3–4.9 s, click, dbt docs Code tab opens 5.1 s, Iceberg line highlights 5.6 s */
  .curB { animation:curB 12s infinite; }
  @keyframes curB { 0%,35%{transform:translate(0,0);opacity:0} 36%{opacity:1;transform:translate(0,0)} 40%,41%{transform:translate(-420px,-150px);opacity:1} 42%{transform:translate(-420px,-150px) scale(.85)} 43%,63%{transform:translate(-420px,-150px);opacity:1} 65%,100%{opacity:0} }
  .docwin { animation:docwin 12s infinite; transform-origin:0 0; }
  @keyframes docwin { 0%,42%{opacity:0;transform:scale(.97)} 44%,64%{opacity:1;transform:scale(1)} 67%,100%{opacity:0} }
  .iceHL { animation:iceHL 12s infinite; } @keyframes iceHL { 0%,46%{opacity:0} 48%,64%{opacity:1} 67%,100%{opacity:0} }
  .capB { animation:capB 12s infinite; } @keyframes capB { 0%,49%{opacity:0} 52%,64%{opacity:1} 67%,100%{opacity:0} }
  /* scene C (8–12 s): PII path draws 8.6–9.8 s, badges 10 s */
  .drawC { stroke-dasharray:900; stroke-dashoffset:900; animation:drawC 12s infinite; }
  @keyframes drawC { 0%,71%{stroke-dashoffset:900} 81%,100%{stroke-dashoffset:0} }
  .hlC { animation:hlC 12s infinite; } @keyframes hlC { 0%,73%{opacity:0} 79%,100%{opacity:1} }
  .capC { animation:capC 12s infinite; } @keyframes capC { 0%,83%{opacity:0} 86%,97%{opacity:1} 100%{opacity:0} }
  .paused * { animation-play-state:paused !important; }
</style>
</head>
<body>

      <text x="24" y="64" style="font-size:19px;font-weight:700">int_price_with_indicators</text><text x="270" y="64" style="font-size:12px;fill:var(--muted)">table</text>

        <text x="40" y="126">{{ config(</text>

      <text x="20" y="57" class="cap2">Where personal data lives, where it went, who can see it — for APRA, ASIC, AUSTRAC and the Privacy Act. Kept in your own database, per build.</text>

</svg>
</div>
<script>
  const t = parseFloat(new URLSearchParams(location.search).get('t'));
  if (!isNaN(t)) { document.querySelectorAll('*').forEach(el => { el.style.animationDelay = (-t) + 's'; }); document.getElementById('stage').classList.add('paused'); }
</script>
