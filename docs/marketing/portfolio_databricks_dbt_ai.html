      <foreignObject x="20" y="70" width="560" height="34"><div xmlns="http://www.w3.org/1999/xhtml" class="typeC" style="font:14.5px -apple-system,'Segoe UI',Roboto,sans-serif;color:#1f2328;padding:6px 0">Which artists have the most albums? Top 5.</div></foreignObject>

        <text x="14" y="34" class="mono" style="fill:#c9d1d9">SELECT ar.name AS artist, COUNT(al.album_id) AS albums</text>
        <text x="14" y="56" class="mono" style="fill:#c9d1d9">FROM azure_datapai_databricks_dev.chinook.album al</text>
        <text x="14" y="78" class="mono" style="fill:#c9d1d9">JOIN azure_datapai_databricks_dev.chinook.artist ar</text>
        <text x="14" y="100" class="mono" style="fill:#c9d1d9">  ON al.artist_id = ar.artist_id</text>
        <text x="14" y="122" class="mono" style="fill:#c9d1d9">GROUP BY ar.name ORDER BY albums DESC LIMIT 5</text>

<script>
  function fitStage(){ const st=document.getElementById('stage'); const sc=Math.min(window.innerWidth/1200, window.innerHeight/675); st.style.transform='scale('+sc+')'; document.body.style.width=(1200*sc)+'px'; document.body.style.height=(675*sc)+'px'; }
  window.addEventListener('resize', fitStage); fitStage();
  const t = parseFloat(new URLSearchParams(location.search).get('t'));
  if (!isNaN(t)) { document.querySelectorAll('*').forEach(el => { el.style.animationDelay = (-t) + 's'; }); document.getElementById('stage').classList.add('paused'); }
</script>
